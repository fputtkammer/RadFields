Ultraschall:
  - Type: US_Hals
    Templates:
      - name: Schilddrüse
        parent: false
        children: false
        filepath: ultrasound/neck_thyroid.yaml
        explanation: Untersuchung der Schilddrüse bei V.a. Funktionsstörungen (Hyperthyreose, Hypothyreose), Autoimmunerkrankungen (Hashimoto, M. Basedow), Knoten, Zysten, Struma, Malignome. Verlaufskontrollen.
      - name: Halslymphknoten
        parent: false
        children: false
        filepath: ultrasound/neck_lymph_nodes.yaml
        explanation: Beurteilung von Größe, Form, Struktur und Vaskularisation der Halslymphknoten bei V.a. Entzündung, Metastasierung oder Lymphom. Gezielte Suche bei bekannten Primärtumoren.
      - name: Speicheldrüsen
        parent: false
        children: false
        filepath: ultrasound/neck_salivary_glands.yaml
        explanation: Untersuchung der Glandula parotis, submandibularis und sublingualis bei V.a. Sialolithiasis (Steine), Sialadenitis (Entzündung), Abszess oder Tumoren.
  - Type: US_Weichteile
    Templates:
      - name: Mamma
        parent: false
        children: false
        filepath: ultrasound/soft_tissue_breast.yaml
        explanation: Ergänzung zur Mammographie, Brustkrebsvorsorge oder -nachsorge, Abklärung tastbarer Befunde, Zysten, Tumoren, Mastitis. Beurteilung der axillären Lymphknoten.
      - name: Weichteilraumforderungen
        parent: false
        children: false
        filepath: ultrasound/soft_tissue_lesion.yaml
        explanation: Abklärung unklarer Schwellungen, Raumforderungen (z.B. Lipom, Atherom, Abszess, Hämatom, Serom, Tumor), Fremdkörperlokalisation.
      - name: Muskuloskelettal (ohne Gelenke)
        parent: false
        children: false
        filepath: ultrasound/soft_tissue_musculoskeletal.yaml
        explanation: Beurteilung von Muskeln und Sehnen bei V.a. Ruptur, Tendinitis, Tendinose, Bursitis, Muskelverletzung (z.B. Rotatorenmanschette, Achillessehne, Bizepssehne).
      - name: Nervenkompression
        parent: false
        children: false
        filepath: ultrasound/soft_tissue_nerve_compression.yaml
        explanation: Darstellung peripherer Nerven zur Abklärung von Kompressionssyndromen (z.B. Karpaltunnelsyndrom, Sulcus-ulnaris-Syndrom).
      - name: Hernien
        parent: false
        children: false
        filepath: ultrasound/abdomen_hernia.yaml
        explanation: Nachweis oder Ausschluss von Hernien (Leistenhernie, Nabelhernie, Narbenhernie, Femoralhernie).
      - name: Gelenke
        parent: false
        children: false
        filepath: ultrasound/soft_tissue_joints.yaml
        explanation: Beurteilung von Gelenkstrukturen bei V.a. Erguss, Synovitis, Arthritis, Baker-Zyste, freie Gelenkkörper, Knorpelschäden (begrenzt).
      - name: Rheuma Hände
        parent: false
        children: false
        filepath: ultrasound/soft_tissue_hands_rheumatology.yaml
        explanation: Beurteilung rheumatischer Veränderungen der Hände, insbesondere der Fingergelenke und Sehnen.
  - Type: US_Abdomen
    Templates:
      - name: Abdomen
        parent: false
        children: false
        filepath: ultrasound/abdomen_standard.yaml
        explanation: Standarduntersuchung des Abdomens. Leber (Fettleber, Zirrhose, Raumforderungen), Gallenblase/-wege (Steine, Entzündung), Pankreas (Pankreatitis, Tumoren), Milz (Größe, Struktur), Nieren (Stauung, Zysten, Tumoren), Aorta abdominalis.
      - name: Urogenitaltrakt
        parent: false
        children: false
        filepath: ultrasound/abdomen_urogenital.yaml
        explanation: Fokussierte Untersuchung von Nieren, Harnblase, (bei Männern Prostata transabdominal), (bei Frauen Uterus/Adnexe transabdominal) bei V.a. Harnstau, Nierensteine, Tumoren, Zysten, Restharnbestimmung.
      - name: Gynäkologisch (transvaginal/transabdominal)
        parent: false
        children: false
        filepath: ultrasound/abdomen_gynecological.yaml
        explanation: Gezielte Untersuchung von Uterus, Endometrium, Ovarien und Adnexen, meist transvaginal, zur Abklärung von Blutungsstörungen, Zysten, Myomen, Tumoren, Extrauteringravidität.
      - name: Trauma (FAST)
        parent: false
        children: false
        filepath: ultrasound/abdomen_fast.yaml
        explanation: Fokussierte Untersuchung nach Trauma zum Nachweis/Ausschluss freier Flüssigkeit in Perikard, Pleura, Peritonealhöhle (Morison-Tasche, Koller-Pouch, Douglas-Raum) - Focused Assessment with Sonography for Trauma.
      - name: Transplantatkontrolle
        parent: false
        children: false
        filepath: ultrasound/abdomen_transplant.yaml
        explanation: Verlaufskontrolle von Nieren-, Leber- oder Pankreastransplantaten (Perfusion mittels Doppler/Duplex, Parenchymstruktur, Komplikationen wie Abstoßung, Stenose, Thrombose).
      - name: Kontrastmittel (CEUS)
        parent: false
        children: false
        filepath: ultrasound/abdomen_ceus.yaml
        explanation: Charakterisierung fokaler Läsionen (v.a. Leber, Niere) mittels Ultraschall-Kontrastmittel zur Differenzierung benigne/maligne.
      - name: Elastographie
        parent: false
        children: false
        filepath: ultrasound/abdomen_elastography.yaml
        explanation: Messung der Gewebesteifigkeit, v.a. zur Beurteilung des Leberfibrosegrades.
      - name: Interventionelle Planung/Kontrolle
        parent: false
        children: false
        filepath: ultrasound/abdomen_intervention.yaml
        explanation: Sonographisch gesteuerte Punktionen (Aszites, Pleura), Drainagenanlagen, Biopsien, Zystenaspirationen.
      - name: Pädiatrie Abdomen
        parent: false
        children: false
        filepath: ultrasound/pediatric_abdomen.yaml
        explanation: Spezifische pädiatrische Fragestellungen wie Pylorusstenose, Invagination, Appendizitis.
      - name: Pädiatrie Hüfte
        parent: false
        children: false
        filepath: ultrasound/pediatric_hip.yaml
        explanation: Spezifische pädiatrische Fragestellungen nach Hüftdysplasie (Screening nach Graf).
  - Type: US_Gefaesse
    Templates:
      - name: Venen Bein (Thromboseausschluss)
        parent: false
        children: false
        filepath: ultrasound/vascular_vein_leg.yaml
        explanation: Duplexsonographie der tiefen und oberflächlichen Beinvenen zum Ausschluss oder Nachweis einer tiefen Venenthrombose (TVT) oder Varikophlebitis.
      - name: Venen Arm (Thromboseausschluss)
        parent: false
        children: false
        filepath: ultrasound/vascular_vein_arm.yaml
        explanation: Duplexsonographie der tiefen und oberflächlichen Armvenen zum Ausschluss oder Nachweis einer Thrombose, oft bei ZVK-Trägern oder nach Punktionen.
      - name: Arterien Bein (pAVK, Aneurysma, Entzündung)
        parent: false
        children: false
        filepath: ultrasound/vascular_artery_leg.yaml
        explanation: Duplex-/Dopplersonographie der Becken- und Beinarterien zur Abklärung von Stenosen, Verschlüssen (pAVK), Aneurysmen, Vaskulitis oder Verletzungsfolgen (z.B. Pseudoaneurysma).
      - name: Arterien Arm (Stenose, Aneurysma, Entzündung)
        parent: false
        children: false
        filepath: ultrasound/vascular_artery_arm.yaml
        explanation: Duplex-/Dopplersonographie der Arm- und Schulterarterien zur Abklärung von Stenosen (z.B. Subclavian-Steal-Syndrom), Aneurysmen, Vaskulitis oder Verletzungsfolgen.
      - name: Extrakranielle Hirnarterien (Carotis/Vertebralis)
        parent: false
        children: false
        filepath: ultrasound/vascular_neck.yaml
        explanation: Duplex-/Dopplersonographie der A. carotis communis, interna, externa und A. vertebralis zur Detektion von Stenosen, Plaques, Dissektionen. Beurteilung der A. temporalis bei V.a. Arteriitis temporalis.
      - name: Aorta abdominalis (Screening/Kontrolle)
        parent: false
        children: false
        filepath: ultrasound/vascular_aorta.yaml
        explanation: Messung des Aortendurchmessers zum Screening oder zur Verlaufskontrolle eines Aortenaneurysmas (AAA).
      - name: Shunt-/Transplantatgefäßkontrolle
        parent: false
        children: false
        filepath: ultrasound/vascular_shunt.yaml
        explanation: Duplexsonographische Beurteilung von Dialyseshunts (AV-Fistel, Graft) oder der Gefäßversorgung von Transplantaten (z.B. Nierentransplantatarterie/-vene) auf Funktion, Stenosen, Thrombosen.
  - Type: US_Thorax
    Templates:
      - name: Lungen
        parent: false
        children: false
        filepath: ultrasound/chest_lungs.yaml
        explanation: Nachweis, Quantifizierung und Beurteilung von Pleuraergüssen, Pleuritis, Pleuraschwarten, Ausschluss/Diagnose eines Pneumothorax, Pneumonie.
  - Type: US_Herz
    Templates:
      - name: TTE Standard
        parent: false
        children: false
        filepath: ultrasound/cardiac_tte.yaml
        explanation: Transthorakale Echokardiographie zur Beurteilung von Herzgröße, Pumpfunktion (EF), Klappenfunktion, Perikarderguss.
      - name: TEE
        parent: false
        children: false
        filepath: ultrasound/cardiac_tee.yaml
        explanation: Transösophageale Echokardiographie zur detaillierteren Beurteilung, v.a. Klappen, Vorhofohr, Endokarditis.

Röntgen:
  - Type: Röntgen Thorax
    Templates:
      - name: Thorax Standard
        parent: false
        children:
          - Hemithorax
        filepath: xray/chest_standard.yaml
        explanation: Standardaufnahme des Thorax zur Beurteilung von Lunge, Herz, Mediastinum und Skelett. Mit oder ohne Seitaufnahme.

      - name: Hemithorax
        parent: Thorax Standard
        children: false
        filepath: xray/chest_hemithorax.yaml
        explanation: Einseitige Aufnahme des Thorax zur Beurteilung von Rippenfrakturen.

  - Type: Röntgen Skelett
    Templates:
      - name: Röntgen Extremitäten
        parent: false
        children:
          - Röntgen Extremitäten Trauma
          - Röntgen Extremitäten Rheuma
          - Röntgen Extremitäten Arthrose
          - Röntgen Extremitäten nach OP
        filepath: xray/extremities_standard.yaml
        explanation: Röntgenaufnahmen der Extremitäten (Arme, Beine, Gelenke).

      - name: Röntgen Becken
        parent: false
        children:
          - Röntgen Becken Trauma
          - Röntgen Becken Rheuma
        filepath: xray/pelvis_standard.yaml
        explanation: Röntgenaufnahme des Beckens.

      - name: Röntgen Wirbelsäule
        parent: false
        children:
          - Röntgen HWS
          - Röntgen BWS
          - Röntgen LWS
        filepath: xray/spine_standard.yaml
        explanation: Aufnahmen der Wirbelsäule zur Beurteilung von Frakturen, Luxationen, Arthrose und rheumatischen Veränderungen.

      # CHILD TEMPLATES nach klinischer Fragestellung
      - name: Röntgen Extremitäten Trauma
        parent: Röntgen Extremitäten
        children: false
        filepath: xray/extremities_trauma.yaml
        explanation: Aufnahmen der Extremitäten zur Beurteilung von Frakturen und Luxationen.

      - name: Röntgen Extremitäten Rheuma
        parent: Röntgen Extremitäten
        children: false
        filepath: xray/extremities_rheumatology.yaml
        explanation: Spezielle Aufnahmen der Extremitäten bei rheumatischen Erkrankungen zur detaillierten Beurteilung von Erosionen, Gelenkspaltweite, Deformitäten und Subluxationen.

      - name: Röntgen Extremitäten Arthrose
        parent: Röntgen Extremitäten
        children: false
        filepath: xray/extremities_arthritis.yaml
        explanation: Aufnahmen der Extremitäten zur Beurteilung degenerativer Gelenkveränderungen, Gelenkspalteinengung und Osteophyten.

      - name: Röntgen Extremitäten nach OP
        parent: Röntgen Extremitäten
        children: false
        filepath: xray/extremities_post_op.yaml
        explanation: Aufnahmen der Extremitäten nach chirurgischen Eingriffen zur Beurteilung von Osteosynthesematerial, Prothesen (TEP), Frakturheilung und Komplikationen.

      - name: Röntgen Becken Trauma
        parent: Röntgen Becken
        children: false
        filepath: xray/pelvis_trauma.yaml
        explanation: Aufnahme des Beckens zur Beurteilung von Frakturen, Luxationen und Osteosynthesematerial.

      - name: Röntgen Becken Rheuma
        parent: Röntgen Becken
        children: false
        filepath: xray/pelvis_rheumatology.yaml
        explanation: Spezielle Aufnahme des Beckens bei rheumatischen Erkrankungen zur Beurteilung von Sakroiliitis, Erosionen und Gelenkveränderungen.

      # SPINE CHILD TEMPLATES (kept separate due to different positioning/trauma protocols)
      - name: Röntgen HWS
        parent: Röntgen Wirbelsäule
        children: false
        filepath: xray/cervical_spine.yaml
        explanation: Aufnahme der Halswirbelsäule zur Beurteilung von Frakturen, Instabilitäten, Arthrose und rheumatischen Veränderungen.

      - name: Röntgen BWS
        parent: Röntgen Wirbelsäule
        children: false
        filepath: xray/thoracic_spine.yaml
        explanation: Aufnahme der Brustwirbelsäule zur Beurteilung von Frakturen, Arthrose und rheumatischen Veränderungen.

      - name: Röntgen LWS
        parent: Röntgen Wirbelsäule
        children: false
        filepath: xray/lumbar_spine.yaml
        explanation: Aufnahme der Lendenwirbelsäule zur Beurteilung von Frakturen, Arthrose und rheumatischen Veränderungen.

  - Type: Röntgen Kopf
    Templates:
      - name: Röntgen Kopf Standard
        parent: false
        children:
          - Gesichtsschädel
          - Nasennebenhöhlen
          - Panoramaaufnahme
        filepath: xray/head_standard.yaml
        explanation: Aufnahmen des Kopfes zur Beurteilung von Frakturen, Entzündungen und Zahnstatus.

      - name: Gesichtsschädel
        parent: Röntgen Kopf Standard
        children: false
        filepath: xray/facial_skull.yaml
        explanation: Aufnahme des Gesichtsschädels zur Beurteilung von Frakturen und Osteosynthesematerial.

      - name: Nasennebenhöhlen
        parent: Röntgen Kopf Standard
        children: false
        filepath: xray/sinuses.yaml
        explanation: Aufnahme der Nasennebenhöhlen zur Beurteilung von Entzündungen, Zysten und Sekretverhalt.

      - name: Panoramaaufnahme
        parent: Röntgen Kopf Standard
        children: false
        filepath: xray/panorama.yaml
        explanation: Panoramaaufnahme des Kiefers zur Beurteilung von Zahnstatus, Kieferveränderungen und Tumoren.

  - Type: Röntgen Abdomen
    Templates:
      - name: Abdomen Standard
        parent: false
        children: false
        filepath: xray/abdomen_standard.yaml
        explanation: Aufnahme des Abdomens zur Beurteilung von Darmgas, Ileus, Fremdkörpern und Passagestörungen.

  - Type: Durchleuchtung
    Templates:
      - name: Durchleuchtung Standard
        parent: false
        children:
          - Breischluck
          - Kontrasteinlauf
          - Urographie
          - Gelenkdarstellung
        filepath: xray/fluoroscopy_standard.yaml
        explanation: Durchleuchtungsuntersuchungen mit Kontrastmittel zur dynamischen Beurteilung verschiedener Organsysteme.

      - name: Breischluck
        parent: Durchleuchtung Standard
        children: false
        filepath: xray/fluoroscopy_swallow.yaml
        explanation: Durchleuchtung des oberen Verdauungstrakts nach oraler Kontrastmittelgabe zur Beurteilung von Schluckstörungen und Reflux.

      - name: Kontrasteinlauf
        parent: Durchleuchtung Standard
        children: false
        filepath: xray/fluoroscopy_enema.yaml
        explanation: Durchleuchtung des Dickdarms nach rektaler Kontrastmittelgabe zur Beurteilung von Stenosen und Anastomosen.

      - name: Urographie
        parent: Durchleuchtung Standard
        children: false
        filepath: xray/fluoroscopy_urography.yaml
        explanation: Durchleuchtung des Harntrakts nach intravenöser Kontrastmittelgabe zur Beurteilung von Abflussstörungen.

      - name: Gelenkdarstellung
        parent: Durchleuchtung Standard
        children: false
        filepath: xray/fluoroscopy_joints.yaml
        explanation: Durchleuchtung von Gelenken (Arthrographie) und Wirbelsäule (Myelographie) nach Kontrastmittelgabe zur Strukturbeurteilung.
  - Type: Mammographie
    Templates:
      - name: Mammographie Standard
        parent: false
        children: false
        filepath: xray/mammography_standard.yaml
        explanation: Mammographische Aufnahme zur Früherkennung von Brustkrebs und Beurteilung von Mammakarzinomen.

Computer Tomographie:
  - Type: CT Kopf
    Templates:
      # MAIN PARENT TEMPLATES - INTRAKRANIELLE BILDGEBUNG UND FAZIALE STRUKTUREN
      - name: CT Kopf mit oder ohne Kontrastmittel
        parent: false # Basistemplate für alle intrakraniellen Untersuchungen.
        children:
          - CT Kopf nach OP
          - CT Perfusion Kopf
          - CT Angiographie Kopf-Hals
        filepath: ct/ct_head_standard.yaml
        explanation: Computertomographie des Schädels mit oder ohne Kontrastmittel zur Beurteilung von Blutungen, Frakturen, Tumoren, Infarkten.

      - name: CT Gesichtsschädel
        parent: false # Basistemplate für alle fazialen Strukturen.
        children:
          - CT Nasennebenhöhlen
          - CT Felsenbein
          - CT Kiefer
        filepath: ct/ct_facial_skull.yaml
        explanation: Computertomographie des Gesichtsschädels zur Beurteilung von Frakturen, Tumoren und Fehlbildungen.

      # CHILD TEMPLATES - INTRAKRANIELLE BILDGEBUNG
      - name: CT Angiographie Kopf-Hals
        parent: CT Kopf mit oder ohne Kontrastmittel
        children: false
        filepath: ct/ct_angiography_head_neck.yaml
        explanation: CT Darstellung von Carotiden, Vertebralarterien und intrakraniellen Gefäßen mit Weichteilbeurteilung; wählen, wenn eine Kopf-/Hals-Angiographie statt einer diagnostischen Standard-CT geplant ist.

      - name: CT Kopf nach OP
        parent: CT Kopf mit oder ohne Kontrastmittel
        children: false
        filepath: ct/ct_head_post_op.yaml
        explanation: Computertomographie des Schädels nach neurochirurgischen Eingriffen zur Beurteilung von Komplikationen wie Blutungen, Infektionen, Shuntfunktion oder Tumorrest.

      - name: CT Perfusion Kopf
        parent: CT Kopf mit oder ohne Kontrastmittel
        children: false
        filepath: ct/ct_perfusion_head.yaml
        explanation: Computertomographie zur Beurteilung der zerebralen Perfusion bei Schlaganfallverdacht mit Bestimmung von CBF, CBV, MTT und TTP.

      # CHILD TEMPLATES - FAZIALE STRUKTUREN
      - name: CT Nasennebenhöhlen
        parent: CT Gesichtsschädel
        children: false
        filepath: ct/ct_sinuses.yaml
        explanation: Computertomographie der Nasennebenhöhlen zur Beurteilung von Sinusitis, Polyposis, Zysten und präoperativen Planung.

      - name: CT Felsenbein
        parent: CT Gesichtsschädel
        children: false
        filepath: ct/ct_temporal_bone.yaml
        explanation: Hochauflösende Computertomographie des Felsenbeins zur Beurteilung des Mittel- und Innenohrs bei Otosklerose, Cholesteatom, Frakturen oder Hörverlust.

      - name: CT Kiefer
        parent: CT Gesichtsschädel
        children: false
        filepath: ct/ct_mandible_maxilla.yaml
        explanation: Computertomographie der Kiefer zur Beurteilung von Zahnstatus, Kieferzysten, Tumoren, Frakturen und präimplantärer Diagnostik.

  - Type: CT Hals
    Templates:
      # MAIN PARENT TEMPLATE
      - name: CT Hals Standard
        parent: false
        children:
          - CT Hals Trauma
          - CT Hals Raumforderung
          - CT Hals Entzündung
        filepath: ct/ct_neck_standard.yaml
        explanation: Computertomographie des Halses zur Beurteilung von Weichteilen, Lymphknoten, Schilddrüse, Gefäßen und Atemwegen.

      - name: CT Angiographie Kopf-Hals
        parent: CT Kopf mit oder ohne Kontrastmittel
        children: false
        filepath: ct/ct_angiography_head_neck.yaml
        explanation: CT Darstellung von Carotiden, Vertebralarterien und intrakraniellen Gefäßen mit Weichteilbeurteilung; wählen, wenn eine Kopf-/Hals-Angiographie statt einer diagnostischen Standard-CT geplant ist.

      # CHILD TEMPLATES
      - name: CT Hals Trauma
        parent: CT Hals Standard
        children: false
        filepath: ct/ct_neck_trauma.yaml
        explanation: Computertomographie des Halses nach Trauma zur Beurteilung von Frakturen, Hämatomen, Gefäßverletzungen und Fremdkörpern.

      - name: CT Hals Raumforderung
        parent: CT Hals Standard
        children: false
        filepath: ct/ct_neck_mass.yaml
        explanation: Computertomographie des Halses zur Beurteilung von Raumforderungen (Schilddrüsenknoten, Lymphome, Metastasen, Primärtumoren) und deren Staging.

      - name: CT Hals Entzündung
        parent: CT Hals Standard
        children: false
        filepath: ct/ct_neck_inflammation.yaml
        explanation: Computertomographie des Halses zur Beurteilung von Entzündungen, Abszessen, Phlegmonen und Zellulitis.

  - Type: CT Thorax
    Templates:
      - name: CT Thorax Standard
        parent: false # Basis für alle thorakalen Untersuchungen.
        children:
          - CT Thorax Trauma
          - CT Thorax Raumforderung
          - CT Thorax Lungenparenchym
          - CT Thorax Lungenembolie
        filepath: ct/ct_thorax_standard.yaml
        explanation: Computertomographie des Thorax zur Beurteilung von Lunge, Mediastinum, Pleura und thorakalen Strukturen.

      # CHILD TEMPLATES
      - name: CT Thorax Trauma
        parent: CT Thorax Standard
        children: false
        filepath: ct/ct_thorax_trauma.yaml
        explanation: Computertomographie des Thorax nach Trauma zur Beurteilung von Frakturen, Pneumothorax, Hämatothorax, Organrupturen und Aortenverletzungen.

      - name: CT Thorax Raumforderung
        parent: CT Thorax Standard
        children: false
        filepath: ct/ct_thorax_mass.yaml
        explanation: Computertomographie des Thorax zur Beurteilung von Raumforderungen (Lungentumoren, Lymphome, Metastasen) mit Staging und Ausbreitungsdiagnostik.

      - name: CT Thorax Lungenparenchym
        parent: CT Thorax Standard
        children: false
        filepath: ct/ct_thorax_parenchyma.yaml
        explanation: Computertomographie des Thorax zur Beurteilung von Lungenparenchymerkrankungen (Pneumonie, Fibrose, interstitielle Lungenerkrankungen, COPD).

      - name: CT Thorax Lungenembolie
        parent: CT Thorax Standard
        children: false
        filepath: ct/ct_thorax_pulmonary_embolism.yaml
        explanation: CT-Pulmonalisangiographie zur Beurteilung von Lungenembolien mit speziellem Kontrastmittelprotokoll und pulmonalarteriellem Timing.

      - name: CT Angiographie Thorax
        parent: CT Angiographie Standard
        children: false
        filepath: ct/ct_angiography_thorax.yaml
        explanation: Computertomographie mit Kontrastmittel zur Beurteilung der Gefäße im Thoraxbereich (A. pulmonalis, A. subclavia) auf Stenosen, Aneurysmen, Dissektionen.

  - Type: CT Herz
    Templates:
      - name: CT Herz Standard
        parent: false # Basis für alle kardialen Untersuchungen.
        children:
          - CT Koronararterien
          - CT Herz Pulmonalvenenisolation
        filepath: ct/ct_heart_standard.yaml
        explanation: Computertomographie des Herzens zur Beurteilung von Koronararterien, Herzklappen, Myokard und Perikard.

      # CHILD TEMPLATES
      - name: CT Koronararterien
        parent: CT Herz Standard
        children: false
        filepath: ct/ct_heart_coronary_angiography.yaml
        explanation: CT-Koronarangiographie zur Beurteilung von Koronarstenosen, Plaques und Bypässen mit EKG-Gating und optimiertem Kontrastprotokoll.

      - name: CT Herz Pulmonalvenenisolation
        parent: CT Herz Standard
        children: false
        filepath: ct/ct_heart_intervention.yaml
        explanation: Computertomographie zur Planung einer Pulmonalvenenisolation.

  - Type: CT Angiographie
    Templates:
      - name: CT Angiographie Standard
        parent: false # Basis für alle angiographischen Untersuchungen außerhalb des Herzens.
        children:
          - CT Aorta komplett
          - CT Angiographie Bein
          - CT Angiographie Arm
          - CT Angiographie Thorax
